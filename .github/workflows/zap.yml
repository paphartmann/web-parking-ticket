name: OWASP ZAP

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  full-scan:
    name: Full web application scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start application and database
        run: |
          docker compose up --build --detach
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: http://localhost:8080
          cmd_options: '-j --client-spider'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap_full_scan
      - name: Stop application and database
        if: always()
        run: docker compose down --volumes --remove-orphans

  api-scan:
    name: API scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start application and database
        run: |
          docker compose up --build --detach
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: openapi.yaml
          format: openapi
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap_api_scan
      - name: Stop application and database
        if: always()
        run: docker compose down --volumes --remove-orphans
