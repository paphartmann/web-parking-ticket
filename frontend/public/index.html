<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parking Control</title>
  </head>
  <body>
    <main>
      <h1>Parking Control</h1>
      <section aria-labelledby="entry-heading">
        <h2 id="entry-heading">Entrada de veículo</h2>
        <form id="entry-form">
          <label for="vehicle-plate">Placa do veículo</label>
          <input id="vehicle-plate" name="vehiclePlate" type="text" autocomplete="off" maxlength="10" required />
          <button id="issue-ticket" type="submit">Emitir ticket</button>
        </form>
        <p id="entry-error" role="alert"></p>
        <section id="ticket-result" aria-live="polite" hidden>
          <h3>Ticket emitido</h3>
          <p>Código: <strong id="ticket-code"></strong></p>
          <p>Placa: <span id="ticket-plate"></span></p>
          <p>Entrada: <time id="ticket-time"></time></p>
        </section>
      </section>
      <section aria-labelledby="exit-heading">
        <h2 id="exit-heading">Validar saída</h2>
        <form id="exit-form">
          <label for="exit-ticket-code">Código do ticket</label>
          <input id="exit-ticket-code" type="text" required />
          <button type="submit">Validar saída</button>
        </form>
        <p id="exit-result" aria-live="polite"></p>
      </section>
      <section aria-labelledby="cashier-heading">
        <h2 id="cashier-heading">Caixa</h2>
        <form id="charge-form">
          <label for="charge-ticket-code">Código do ticket</label>
          <input id="charge-ticket-code" type="text" required />
          <button type="submit">Calcular cobrança</button>
        </form>
        <p id="charge-result" aria-live="polite"></p>
        <form id="payment-form">
          <label for="payment-ticket-id">ID do ticket</label>
          <input id="payment-ticket-id" type="text" required />
          <label for="payment-amount">Valor recebido (R$)</label>
          <input id="payment-amount" type="number" min="0" step="0.01" required />
          <button type="submit">Registrar pagamento</button>
        </form>
        <p id="payment-result" aria-live="polite"></p>
      </section>
      <section aria-labelledby="tickets-heading">
        <h2 id="tickets-heading">Tickets</h2>
        <button id="refresh-tickets" type="button">Atualizar lista</button>
        <p id="tickets-error" role="alert"></p>
        <table>
          <thead><tr><th>Código</th><th>Placa</th><th>Entrada</th><th>Status</th></tr></thead>
          <tbody id="tickets-body"></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
