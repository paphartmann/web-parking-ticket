services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: parking_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parking_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/parking_control
      ROCKET_ADDRESS: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
